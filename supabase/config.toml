project_id = "spotter"

[auth]
site_url = "https://simeonrinkenberger.github.io/spotter/"
additional_redirect_urls = [
  "https://simeonrinkenberger.github.io/spotter/",
  "http://localhost:8000",
  "http://127.0.0.1:8000",
]

[auth.email]
enable_signup = true
# Built-in SMTP only allows ~2-4 mails/hour, which would stall every signup.
# Turn this on together with custom SMTP (Resend free tier) before real launch.
enable_confirmations = false
# Minimum gap between two mails to the same address. The default is already "1m",
# which is what the "Resend in 60s" countdown on the landing card is counting; if
# this is ever changed, change the 60 that mailCount() is given in app.ts with it.
# max_frequency = "1m"

# ---------- the signup abuse boundary ----------
# LEFT COMMENTED ON PURPOSE, same convention as the Google/Apple blocks below:
# `supabase config push` writes whatever is uncommented here to the live project,
# and every one of these three switches breaks live signups if it is flipped
# before the thing behind it exists.
#
# The order matters and is not negotiable:
#
#   1. Resend: add quarterdeckcollective.com as a domain and publish the DKIM,
#      SPF and DMARC records it prints, then wait for "Verified". Create an SMTP
#      credential. Until the domain verifies, mail sends and silently lands in
#      spam, which looks exactly like mail that was never sent.
#   2. Uncomment [auth.email.smtp], export SUPABASE_AUTH_SMTP_PASS, push, and send
#      yourself one password reset. Confirm it arrives from the sender below.
#   3. Only then set enable_confirmations = true above, and push. From that moment
#      signUp returns a user with no session and the app shows "Check your email"
#      (the frontend already handles both shapes, so this step is a one-line
#      change with no deploy).
#   4. Turnstile: create the widget, paste the SITE key into PUBLIC_CAPTCHA in
#      supabase/functions/spotter/app.ts, rebuild, ship the page, and only after
#      that page is live uncomment [auth.captcha] and push. Flipping the server
#      first locks out every browser still holding the old page.
#      NOT VERIFIED on the Capacitor shells: Cloudflare states Turnstile needs a
#      WebView, which both shells are, but nobody has run it from
#      capacitor://localhost (iOS) or http://localhost (Android) on a device yet.
#      If it cannot get a token there, native signups break the moment this is
#      pushed. [auth.rate_limit] below is the part that is safe on every client
#      and can go first on its own.
#
# The whole sequence is one command each time: `supabase config push`.

# [auth.captcha]
# enabled = true
# provider = "turnstile"
# # The widget's SECRET key. The site key is public and lives in PUBLIC_CAPTCHA in
# # app.ts; only this half is a secret, and only the reference to it is committed.
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# # 465 is implicit TLS and is what Resend recommends where the client supports it.
# port = 465
# # Resend's SMTP username is the literal string "resend"; the API key is the pass.
# user = "resend"
# pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# # Must be on a domain verified in Resend, or every message is unauthenticated.
# admin_email = "no-reply@quarterdeckcollective.com"
# sender_name = "Spotter"

# ---------- rate limits ----------
# These are the per-IP caps gotrue applies before anything else, and they are the
# half of the boundary that does not depend on Cloudflare or on Resend. Every key
# below is in the CLI config reference at 2.116, so they push. Defaults are in
# brackets; the values are sized for a launch at small volume, where a human never
# hits them and a script farming accounts does.
#
# [auth.rate_limit]
# # Emails per hour, project-wide. Resend's free tier is 100/day, so this is the
# # ceiling that keeps a signup flood from spending the whole day's quota in an
# # hour. Raise it with the Resend plan, not before. (default 2, which only suits
# # the built-in sender)
# email_sent = 30
# # Sign-ups and sign-ins per 5 minutes per IP. Six a minute is more than any
# # person types and far less than a farm needs. (default 30)
# sign_in_sign_ups = 12
# # Confirmation and recovery link verifications per 5 minutes per IP. (default 30)
# token_verifications = 12
# # Session refreshes per 5 minutes per IP. Left at the default: a household or an
# # office behind one address refreshes far more than it signs in. (default 150)
# token_refresh = 150
#
# Anonymous sign-ins are NOT rate-limited to zero here on purpose: 0 in a gotrue
# rate limit is not "none allowed", and the switch that actually closes that door
# is `enable_anonymous_sign_ins` under [auth], which is false by default and has
# never been turned on. Leave it that way rather than guessing at a limit.

# ---------- MFA ----------
# The Supabase advisors flag "insufficient MFA options": a project where the only
# factor is a password. Turning TOTP on does not force anyone to use it — it makes
# the enrol and verify endpoints available, so a user who wants an authenticator app
# can add one. Nothing in the app enrols a factor yet; this is the door, not the
# walk through it.
#
# These two keys are in the published CLI config reference
# (https://supabase.com/docs/guides/local-development/cli/config, auth.mfa.totp.*)
# and so are pushable with `supabase config push`. The other two advisor items —
# leaked-password (HIBP) protection and a password policy — are NOT in that
# reference at CLI 2.116.0, and the CLI ignores unknown keys silently rather than
# rejecting them, so writing guesses here would look like protection and be none.
# They are dashboard settings; the exact steps are in README, "Self-hosting".
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ---------- Sign in with Google / Apple ----------
# LEFT COMMENTED ON PURPOSE. `supabase config push` writes whatever is here to the
# live project, so an uncommented block with an empty client_id would switch the
# provider on with no credentials behind it — and the sign-in screen paints its
# button off exactly this state (GET /auth/v1/settings, the "external" map). Enable
# these only when the credentials exist.
#
# Two ways to turn a provider on, and only one of them belongs in git:
#   - Dashboard -> Authentication -> Providers. Nothing to commit, the secret never
#     leaves Supabase. This is the recommended route and the one README describes.
#   - Uncomment below, export SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET (and the Apple
#     one) in the shell, then `supabase config push`. The secret stays in the
#     environment; only the reference to it is committed.
#
# client_id does NOT accept env() substitution — it is a public identifier and is
# meant to be readable. The same value goes into PUBLIC_AUTH in
# supabase/functions/spotter/app.ts so the browser can run the in-page token flow.
# Full setup steps: README, "Sign in with Google / Apple".
#
# [auth.external.google]
# enabled = true
# # Google Cloud Console -> Credentials -> OAuth client ID (Web application).
# client_id = ""
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# # Leave unset: the callback is https://mtzevoxxpsktmrbbuxva.supabase.co/auth/v1/callback
# redirect_uri = ""
# url = ""
# # Leave false. The page sends a nonce with every id_token and gotrue must check it.
# skip_nonce_check = false
#
# [auth.external.apple]
# enabled = true
# # The Apple *Services ID* (e.g. com.example.spotter.web), not the App ID.
# client_id = ""
# # The client-secret JWT signed with the .p8 key — expires, six months maximum.
# secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# redirect_uri = ""
# url = ""
# skip_nonce_check = false

[functions.spotter]
enabled = true
verify_jwt = false
entrypoint = "./functions/spotter/index.ts"

[functions.spotter-purchases]
verify_jwt = false
