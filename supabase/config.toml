project_id = "spotter"

[auth]
site_url = "https://simeonrinkenberger.github.io/spotter/"
additional_redirect_urls = [
  "https://simeonrinkenberger.github.io/spotter/",
  "http://localhost:8000",
  "http://127.0.0.1:8000",
]

[auth.email]
enable_signup = true
# Built-in SMTP only allows ~2-4 mails/hour, which would stall every signup.
# Turn this on together with custom SMTP (Resend free tier) before real launch.
enable_confirmations = false

# ---------- MFA ----------
# The Supabase advisors flag "insufficient MFA options": a project where the only
# factor is a password. Turning TOTP on does not force anyone to use it — it makes
# the enrol and verify endpoints available, so a user who wants an authenticator app
# can add one. Nothing in the app enrols a factor yet; this is the door, not the
# walk through it.
#
# These two keys are in the published CLI config reference
# (https://supabase.com/docs/guides/local-development/cli/config, auth.mfa.totp.*)
# and so are pushable with `supabase config push`. The other two advisor items —
# leaked-password (HIBP) protection and a password policy — are NOT in that
# reference at CLI 2.116.0, and the CLI ignores unknown keys silently rather than
# rejecting them, so writing guesses here would look like protection and be none.
# They are dashboard settings; the exact steps are in README, "Self-hosting".
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ---------- Sign in with Google / Apple ----------
# LEFT COMMENTED ON PURPOSE. `supabase config push` writes whatever is here to the
# live project, so an uncommented block with an empty client_id would switch the
# provider on with no credentials behind it — and the sign-in screen paints its
# button off exactly this state (GET /auth/v1/settings, the "external" map). Enable
# these only when the credentials exist.
#
# Two ways to turn a provider on, and only one of them belongs in git:
#   - Dashboard -> Authentication -> Providers. Nothing to commit, the secret never
#     leaves Supabase. This is the recommended route and the one README describes.
#   - Uncomment below, export SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET (and the Apple
#     one) in the shell, then `supabase config push`. The secret stays in the
#     environment; only the reference to it is committed.
#
# client_id does NOT accept env() substitution — it is a public identifier and is
# meant to be readable. The same value goes into PUBLIC_AUTH in
# supabase/functions/spotter/app.ts so the browser can run the in-page token flow.
# Full setup steps: README, "Sign in with Google / Apple".
#
# [auth.external.google]
# enabled = true
# # Google Cloud Console -> Credentials -> OAuth client ID (Web application).
# client_id = ""
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# # Leave unset: the callback is https://mtzevoxxpsktmrbbuxva.supabase.co/auth/v1/callback
# redirect_uri = ""
# url = ""
# # Leave false. The page sends a nonce with every id_token and gotrue must check it.
# skip_nonce_check = false
#
# [auth.external.apple]
# enabled = true
# # The Apple *Services ID* (e.g. com.example.spotter.web), not the App ID.
# client_id = ""
# # The client-secret JWT signed with the .p8 key — expires, six months maximum.
# secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# redirect_uri = ""
# url = ""
# skip_nonce_check = false

[functions.spotter]
enabled = true
verify_jwt = false
entrypoint = "./functions/spotter/index.ts"
