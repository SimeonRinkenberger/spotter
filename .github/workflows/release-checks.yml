name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    needs: native-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.6'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      # web-dist/ is a build output (not committed): the harnesses below read the
      # app page from it, so it is built first. The same step proves the published
      # landing page's CSP is current.
      - run: node tools/verify-build-diff.mjs
      - run: npm install --prefix "$RUNNER_TEMP/guard-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - run: node tools/ai-guard-db-check.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tools/reader-access-check.mjs
      - run: node tools/reader-db-check.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tools/security-db-check.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tools/erasure-outbox-check.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tools/goals-db-check.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: npm run gtm:check
        env:
          PGLITE_MODULE: ${{ runner.temp }}/guard-db/node_modules/@electric-sql/pglite/dist/index.js
      - run: deno check supabase/functions/spotter/index.ts
      - run: deno run --allow-env tools/ai-guard-check.ts
      - run: deno run --allow-read --allow-env tools/ai-admission-check.ts
      - run: deno run --allow-read tools/ai-price-check.ts
      - run: deno run --allow-read tools/source-trust-check.ts
      - run: deno run --allow-read tools/ssrf-policy-check.ts
      - run: deno run --allow-env --allow-read tools/push-ssrf-check.ts
      - run: deno run --allow-env --allow-read tools/push-tick-retry-check.ts
      - run: deno run --allow-read tools/merge-harness.ts
      - run: deno run --allow-read --allow-env tools/ingest-coverage-harness.ts
      - run: deno run --allow-read tools/pack-eval/offline.ts
      - run: deno run --allow-read tools/pack-eval/score-test.ts
      - run: node tools/csp-check.mjs
      - run: node tools/retire-web-check.mjs
      - run: node tools/sw-harness.mjs
      - run: node tools/pager-harness.mjs
      # Headless Chrome (preinstalled on ubuntu-latest) against a fake Supabase on
      # 127.0.0.1; without a Chrome it says SKIP and passes.
      - run: node tools/firstrun-harness.mjs
  native-parity:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run parity:check
      # Report only: does this pull request change what the iOS and Android apps
      # run? Builds native-dist/ from the base branch and from the PR and compares
      # every file. A difference is not an error (most app changes are meant to
      # make one); it says the change ships only in a new store build.
      - name: Native bundle against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node tools/native-identity-check.mjs FETCH_HEAD --report
