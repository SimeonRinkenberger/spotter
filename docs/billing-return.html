<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Spotter — all set</title>
<link rel="icon" href="icon.png">
<!--
  Stripe Checkout's success address (billing.ts, createCheckout: success_url). Spotter
  no longer sells through Stripe and the web app it used to hand back to is retired,
  so nothing should arrive here any more; the page stays so that an old checkout, or
  one made while a Stripe key is still configured, never ends on a 404 after a card
  was charged. It says the one true thing and points at the app. No script, no fetch,
  no font download, and no link back into a web app that no longer exists.
-->
<style>
  :root { color-scheme: light dark;
    --paper: #F5F6F8; --card: #FFFFFF; --ink: #14171A; --ink-2: #58626E;
    --line: rgba(20,23,26,.09); --good: #178055; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #101214; --card: #191D21; --ink: #EEF2F6; --ink-2: #AFBAC6;
      --line: rgba(238,242,246,.10); --good: #3FD096; }
  }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; box-sizing: border-box; text-align: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom)); }
  .mark { width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 30px; height: 30px; fill: none; stroke: var(--good); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 24px; letter-spacing: -.025em; margin: 0 0 10px; }
  p { color: var(--ink-2); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <h1>You&rsquo;re all set</h1>
  <p>Close this page and open the Spotter app. Your plan is already active there.</p>
</main>
</body>
</html>
